name: Git-info-combine
description: Combine GitHub and GitLab activity into profile README cards. Private work is counted; private names are never shown.
author: Kingpin Apps
branding:
  icon: activity
  color: purple

inputs:
  # Sources
  github-token:
    description: Personal access token for the profile owner (classic, with repo, read:org and read:user). The default GITHUB_TOKEN cannot read your activity in other repos.
    required: false
  gitlab-token:
    description: GitLab personal access token with the read_api scope.
    required: false
  gitlab-url:
    description: Base URL of the GitLab instance. Set this for self-hosted GitLab.
    required: false
    default: https://gitlab.com
  include-org-repos:
    description: Count repos in GitHub organisations you belong to towards languages and stars, not only repos you own.
    required: false
    default: "true"
  exclude-repos:
    description: Repos or projects (name or owner/name) to leave out of languages and stars. This file is public, so naming a private repo here reveals its name.
    required: false
  gitlab-mirrors:
    description: GitLab projects (group/project) that mirror GitHub repos, so they count once. Mirrors whose latest commit matches a GitHub repo are found without this. This file is public, so naming a private project here reveals its name.
    required: false
  detect-wordpress:
    description: Count a repo that bundles WordPress core as one PHP repo, rather than counting WordPress's own code as yours.
    required: false
    default: "true"
  wakatime-api-key:
    description: WakaTime API key, needed only for the wakatime card. Only languages are used; project names are dropped.
    required: false
  wakatime-url:
    description: WakaTime API base. Set it for Wakapi or another compatible server.
    required: false
  pins:
    description: "Public repos to pin, one card each: owner/repo or github:owner/repo, gitlab:group/project. Private ones are refused."
    required: false
  gists:
    description: "Public gists to show, one card each: github:<gist id> (your own gists) or gitlab:<snippet id>. Secret ones are refused."
    required: false

  # Output
  cards:
    description: "Cards to build, comma-separated: heatmap, stats, languages, hosts, wakatime, pins, gists, or all."
    required: false
    default: all
  output-dir:
    description: Folder the cards and the cache are written to.
    required: false
    default: git-info-combine
  commit:
    description: Commit and push the cards. Needs actions/checkout and contents write permission.
    required: false
    default: "true"
  commit-message:
    description: Message for the commit.
    required: false
    default: "chore: update git-info-combine cards"
  layout:
    description: "Rows of cards to lay out into exact-width images, one row per line, for example: heatmap / stats languages / wakatime hosts / pins. Writes layout.svg (every row) and row-N.svg. pins and gists mean all of them, two to a row."
    required: false
  layout-width:
    description: Width of every layout row in pixels. Default 800.
    required: false
  layout-gap:
    description: Space between cards in the layout, across and down, in pixels. Default 10.
    required: false
  equal-heights:
    description: Give cards that usually sit side by side the same height (stats, languages and wakatime; pins and gists).
    required: false
    default: "true"

  # Look, for every card
  theme:
    description: auto (follows light or dark mode, and also writes -light and -dark files) or any GitHub Stats Extended theme.
    required: false
    default: auto
  hide-title:
    description: Hide card titles.
    required: false
  hide-border:
    description: Hide card borders.
    required: false
  border-radius:
    description: Corner radius in pixels.
    required: false
  title-color:
    description: Title colour (hex).
    required: false
  icon-color:
    description: Icon colour (hex).
    required: false
  text-color:
    description: Text colour (hex).
    required: false
  bg-color:
    description: Background colour (hex).
    required: false
  border-color:
    description: Border colour (hex).
    required: false
  github-color:
    description: Colour for GitHub activity (hex). Default #40c463.
    required: false
  gitlab-color:
    description: Colour for GitLab activity (hex). Default #fc6d26.
    required: false

  # Stats card
  name:
    description: Name in the stats card title. Defaults to your GitHub login, else your GitLab one.
    required: false
  stats-hide:
    description: "Stats to hide, comma-separated: stars, commits, pullRequests, issues, reviews, contributedTo."
    required: false
  hide-rank:
    description: Hide the rank circle.
    required: false
  show-hosts:
    description: Show which hosts the numbers come from.
    required: false
  number-format:
    description: short (12k) or long (12,014).
    required: false

  # Languages card
  languages-layout:
    description: normal or compact.
    required: false
  languages-count:
    description: How many languages to show. Default 5 (normal) or 6 (compact).
    required: false
  languages-hide:
    description: Languages to leave out, comma-separated.
    required: false
  languages-weighting:
    description: repo (every repo counts once, split by its languages) or size (bytes, so big repos dominate). Default repo.
    required: false

  # Heatmap card
  heatmap-range:
    description: last-year or all.
    required: false
  heatmap-mode:
    description: hosts (each day split by host colour) or single (one colour).
    required: false

  # WakaTime card
  wakatime-range:
    description: last_7_days, last_30_days, last_6_months, last_year or all_time.
    required: false
  wakatime-layout:
    description: normal or compact.
    required: false
  wakatime-count:
    description: How many languages to show. Default 6.
    required: false
  wakatime-hide:
    description: Languages to leave out, comma-separated.
    required: false

outputs:
  files:
    description: The files written, one per line.
  committed:
    description: true if the cards changed and were committed.

runs:
  using: node24
  main: dist/index.js
